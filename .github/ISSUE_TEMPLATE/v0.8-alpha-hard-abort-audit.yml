# **状態:** α試験用案 / Discussion Draft / Not Adopted / Not Verified
name: v0.8-alpha Hard Abort & 監査手順のモック検証
description: CIP/PAL v0.8 α試験の進捗、証拠、未確認事項を記録します。
title: '[v0.8-alpha] Hard Abort & 監査手順のモック検証タスク'
body:
- type: markdown
  attributes:
    value: '**状態:** α試験用案 / Discussion Draft / Not Adopted / Not Verified


      **原則:** A → (A + C) → A′ → B′ ≠ B。試験結果をCanonical Aや意図したBと同一視せず、正式統合・採否は人間が判断します。


      **範囲:** 隔離ローカル環境とモックのみ。外部APIや実運用環境での実行を許可するものではありません。


      **関連資料:**

      - `docs/v0.8-alpha/CIP_PAL_v0.8_Alpha_Specification_Scope_Boundaries_2026-10-16.md`

      - `docs/v0.8-alpha/CIP_PAL_v0.8_Alpha_Operator_Guide_Restrictions_Limits_2026-10-16.md`

      - `docs/v0.8-alpha/CIP_PAL_v0.8_Alpha_Verification_Audit_Tasks_2026-10-16.md`


      本フォームは記録用であり、試験実行・正式統合・Activation・Goを許可しません。チェックは記録済みを示し、PASS・人間承認を意味しません。全項目の初期状態はNOT RUN。v0.7 Final ADOPTは変更しません。

      '
- type: textarea
  id: record_status
  attributes:
    label: 記録の位置づけ
    value: '**状態:** α試験用案 / Discussion Draft / Not Adopted / Not Verified

      A → (A + C) → A′ → B′ ≠ B

      未採択・未検証。v0.7不変更。掲載・記入は試験許可や承認ではない。'
  validations:
    required: true
- type: textarea
  id: test_scope
  attributes:
    label: 試験範囲・条件
    description: 対象ケース、Canonical A／事前基準、C（モデル・ツール・設定・環境）、モック構成を記録してください。
    placeholder: 試験ID、条件、期待結果を記入
  validations:
    required: true
- type: checkboxes
  id: hard_abort
  attributes:
    label: テスト群A：既存Hard Abort手順
    options:
    - label: HA-01：対応する試験の状態・判定・証拠を記録済み
    - label: HA-02：対応する試験の状態・判定・証拠を記録済み
    - label: HA-03：対応する試験の状態・判定・証拠を記録済み
    - label: HA-04：対応する試験の状態・判定・証拠を記録済み
    - label: HA-05：対応する試験の状態・判定・証拠を記録済み
    - label: HA-06：対応する試験の状態・判定・証拠を記録済み
    - label: HA-07：対応する試験の状態・判定・証拠を記録済み
    description: 実施状態・判定・証拠を記録した項目にチェック。成功や承認を意味しません。
- type: checkboxes
  id: audit_approval
  attributes:
    label: テスト群B：追加監査・承認確認
    options:
    - label: B-01：対応する試験の状態・判定・証拠を記録済み
    - label: B-02：対応する試験の状態・判定・証拠を記録済み
    - label: B-03：対応する試験の状態・判定・証拠を記録済み
    description: 実施状態・判定・証拠を記録した項目にチェック。成功や承認を意味しません。
- type: checkboxes
  id: anchor_history
  attributes:
    label: テスト群C：アンカー履歴
    options:
    - label: C-01：対応する試験の状態・判定・証拠を記録済み
    - label: C-02：対応する試験の状態・判定・証拠を記録済み
    description: 実施状態・判定・証拠を記録した項目にチェック。成功や承認を意味しません。
- type: checkboxes
  id: metric_integrity
  attributes:
    label: テスト群D：指標ハック・自律ループ
    options:
    - label: D：対応する試験の状態・判定・証拠を記録済み
    description: 実施状態・判定・証拠を記録した項目にチェック。成功や承認を意味しません。
- type: checkboxes
  id: human_decision
  attributes:
    label: テスト群E：人間の判断・統合可否
    options:
    - label: E：対応する試験の状態・判定・証拠を記録済み
    description: 実施状態・判定・証拠を記録した項目にチェック。成功や承認を意味しません。
- type: textarea
  id: evidence
  attributes:
    label: 実際の挙動・証拠・未確認事項
    description: PASS / FAIL / INDETERMINATE / NOT RUNを区別し、取得できない証拠は不明として記録してください。
    placeholder: diff、監査ログ、署名・タイムスタンプ、独立チェック、未チェック項目など
    value: '| Test ID | 判定（初期値） | 期待結果・実際の挙動 | 証拠参照・未確認事項 |

      |---|---|---|---|

      | HA-01 | NOT RUN | 未記入 | 未記入 |

      | HA-02 | NOT RUN | 未記入 | 未記入 |

      | HA-03 | NOT RUN | 未記入 | 未記入 |

      | HA-04 | NOT RUN | 未記入 | 未記入 |

      | HA-05 | NOT RUN | 未記入 | 未記入 |

      | HA-06 | NOT RUN | 未記入 | 未記入 |

      | HA-07 | NOT RUN | 未記入 | 未記入 |

      | B-01 | NOT RUN | 未記入 | 未記入 |

      | B-02 | NOT RUN | 未記入 | 未記入 |

      | B-03 | NOT RUN | 未記入 | 未記入 |

      | C-01 | NOT RUN | 未記入 | 未記入 |

      | C-02 | NOT RUN | 未記入 | 未記入 |

      | D | NOT RUN | 未記入 | 未記入 |

      | E | NOT RUN | 未記入 | 未記入 |

      '
  validations:
    required: true
- type: textarea
  id: audit_five_requirements
  attributes:
    label: 監査証拠の5要件・承認状態
    value: '1. 対Aのdiff：未確認

      2. 事前定義基準：未確認

      3. 独立チェック（確認者・範囲）：未確認

      4. 署名・時刻・真正性：未確認

      5. 未チェック項目・残存リスク：未確認

      媒介条件変更と影響する旧承認・再承認：未確認'
  validations:
    required: true
- type: textarea
  id: human_disposition
  attributes:
    label: 人間による最終判断
    description: 正式統合は自動で行いません。追加試験、修正、保留、統合候補化などの判断と理由を記録してください。
    placeholder: 未判断の場合は「未判断・保留」。判断時は判断者・時刻・対象diff/証拠・範囲・判断・理由を記入。記入自体は本人性の検証や実行許可ではありません。
  validations:
    required: true
